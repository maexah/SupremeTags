plugins {
    id 'java-library'
    id 'maven-publish'
}

sourceCompatibility = 21
targetCompatibility = 21
group = 'net.noscape.project.supremetags'
version = '2.1.16'

java {
    disableAutoTargetJvm()
}

repositories {
    mavenCentral()

    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url "https://repo.codemc.org/repository/maven-public/" }
    maven { url "https://repo.codemc.org/repository/maven-snapshots/" }
    maven { url 'https://repo.codemc.io/repository/creatorfromhell/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo1.maven.org/maven2/' }
    maven { url 'https://repo.rosewooddev.io/repository/public/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.nexomc.com/releases/' }
    maven { url 'https://repo.nexomc.com/snapshots' }
    maven { url 'https://repo.oraxen.com/releases' }
    maven { url "https://repo.oraxen.com/releases" }
    maven { url "https://repo.nightexpressdev.com/releases" }
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven {
        name "essentialsx-releases"
        url "https://repo.essentialsx.net/releases/"
    }
    maven { url "https://repo.alessiodp.com/releases/" }
    maven { url = "https://repo.lushplugins.org/releases/" }
    maven {
        url = "https://repo.artillex-studios.com/releases/"
    }
}

configurations.all {
    resolutionStrategy {
        force 'io.papermc.paper:paper-api:1.21.9-R0.1-SNAPSHOT'
        eachDependency {
            if (requested.group == 'org.spigotmc' && requested.name == 'spigot-api') {
                useTarget 'io.papermc.paper:paper-api:1.21.9-R0.1-SNAPSHOT'
                because 'Force resolution to match Paper 1.21.9 API'
            }
        }
    }
}

configurations {
    shade
    compileOnly.extendsFrom(shade)
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT'

    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'net.milkbowl.vault:VaultUnlockedAPI:2.16'
    compileOnly 'com.h2database:h2:2.1.214'
    compileOnly 'com.arcaniax:HeadDatabase-API:1.3.3-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.21'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.2'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'org.black_ixx:playerpoints:3.3.2'
    compileOnly 'com.github.LoneDev6:itemsadder-api:3.6.3-beta-14'
    compileOnly 'de.tr7zw:item-nbt-api-plugin:2.15.3'
    compileOnly 'io.th0rgal:oraxen:1.190.0'
    compileOnly 'su.nightexpress.coinsengine:CoinsEngine:2.5.0'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.9.3'
    compileOnly 'io.github.valerashimchuck:simpleitemgenerator-api:1.5.0'
    compileOnly 'net.essentialsx:EssentialsX:2.21.2'

    compileOnly files('libs/Score.jar')
    compileOnly files('libs/ExecutableBlocks.jar')

    shade 'com.github.cryptomorin:XSeries:13.5.1'

    compileOnly 'mysql:mysql-connector-java:8.0.33'
    compileOnly 'redis.clients:jedis:5.1.0'
    shade 'com.zaxxer:HikariCP:7.0.2'
    shade 'net.kyori:adventure-text-minimessage:4.25.0'
    shade 'de.rapha149.signgui:signgui:2.5.4'
    compileOnly "com.nexomc:nexo:1.6.0"
    shade 'commons-lang:commons-lang:2.6'
    shade 'net.wesjd:anvilgui:1.10.10-SNAPSHOT'
    compileOnly 'net.byteflux:libby-bukkit:1.3.1'
    shade 'com.artillexstudios.axapi:axapi:1.4.802:all'
}

processResources {
    def props = [
            version: project.version,
            name: project.name
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def devBuild = project.hasProperty('dev') && project.property('dev').toBoolean()
def devBuildVersion = project.findProperty('devBuildVersion') ?: 'SNAPSHOT'

jar {
    archiveBaseName.set("SupremeTags")

    if (devBuild) {
        archiveVersion.set("${project.version}-DEV-${devBuildVersion}")
    } else {
        archiveVersion.set(project.version.toString())
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'net.noscape.project.supremetags.SupremeTags',
                'Implementation-Title': 'SupremeTags',
                'Implementation-Version': project.version.toString()
        )
    }

    // Include shaded dependencies
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    // XSeries' XMaterial$Data static initializer parses Bukkit.getVersion() with the
    // regex "MC: \d\.(\d+)", which throws on modern Paper/Purpur builds whose MC: tag
    // is the build version (e.g. "MC: 26.1.2") rather than a 1.X.Y Minecraft version.
    // Length-preserving byte replacement of the regex literal in the shaded class so
    // it captures any two-digit run, leaving the constant pool layout intact.
    doLast {
        def file = archiveFile.get().asFile
        byte[] needle = ([0x01, 0x00, 0x0D,
                          0x4D, 0x43, 0x3A, 0x20, 0x5C, 0x64, 0x5C, 0x2E,
                          0x28, 0x5C, 0x64, 0x2B, 0x29] as byte[])
        byte[] replacement = ([0x01, 0x00, 0x0D,
                               0x5C, 0x44, 0x28, 0x5C, 0x64, 0x7B, 0x32, 0x7D,
                               0x29, 0x5C, 0x44, 0x2E, 0x3F] as byte[])
        def tmp = new File(file.parentFile, file.name + ".tmp")
        boolean patched = false
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(tmp.newOutputStream()).withCloseable { out ->
                zip.entries().each { entry ->
                    byte[] bytes = zip.getInputStream(entry).bytes
                    if (entry.name == 'com/cryptomorin/xseries/XMaterial$Data.class') {
                        int idx = -1
                        for (int i = 0; i <= bytes.length - needle.length && idx < 0; i++) {
                            boolean match = true
                            for (int j = 0; j < needle.length; j++) {
                                if (bytes[i + j] != needle[j]) { match = false; break }
                            }
                            if (match) idx = i
                        }
                        if (idx >= 0) {
                            System.arraycopy(replacement, 0, bytes, idx, replacement.length)
                            patched = true
                        }
                    }
                    def newEntry = new java.util.zip.ZipEntry(entry.name)
                    newEntry.time = entry.time
                    out.putNextEntry(newEntry)
                    out.write(bytes)
                    out.closeEntry()
                }
            }
        }
        if (!patched) {
            logger.warn("[supremetags] Did not find XMaterial\$Data version regex to patch")
        } else {
            logger.lifecycle("[supremetags] Patched XMaterial\$Data version regex for Purpur compatibility")
        }
        file.delete()
        tmp.renameTo(file)
    }
}